<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car World Book</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <div class="Book">
        <div class="header">
            <div class="logo-section">
                <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                    <!-- Car Body -->
                    <ellipse cx="50" cy="65" rx="35" ry="15" fill="currentColor" opacity="0.9"/>
                    <!-- Car Top -->
                    <rect x="25" y="35" width="50" height="25" rx="8" fill="currentColor"/>
                    <!-- Windshield -->
                    <polygon points="30,40 35,35 65,35 70,40" fill="#e8f4f8" opacity="0.8"/>
                    <!-- Window -->
                    <rect x="40" y="42" width="20" height="12" rx="2" fill="#b3e5fc" opacity="0.7"/>
                    <!-- Front Wheel -->
                    <circle cx="28" cy="68" r="8" fill="currentColor"/>
                    <circle cx="28" cy="68" r="5" fill="#666"/>
                    <circle cx="28" cy="68" r="3" fill="#999"/>
                    <!-- Rear Wheel -->
                    <circle cx="72" cy="68" r="8" fill="currentColor"/>
                    <circle cx="72" cy="68" r="5" fill="#666"/>
                    <circle cx="72" cy="68" r="3" fill="#999"/>
                    <!-- Headlights -->
                    <circle cx="22" cy="50" r="3" fill="#ffeb3b" opacity="0.9"/>
                    <circle cx="78" cy="50" r="3" fill="#ffeb3b" opacity="0.9"/>
                </svg>
            </div>
            <h1>Car World Book</h1>
            <input type="text" id="searchBar" placeholder="Search for cars...">
            
            <!-- Dark Mode Toggle & Color Picker -->
            <div class="controls">
                <div class="toggle-group">
                    <label class="toggle-label">Dark Mode</label>
                    <button id="toggleDarkMode" class="toggle-btn dark-mode-toggle">
                        <span class="toggle-slider"></span>
                    </button>
                </div>
                
                <!-- Color Picker Toggle -->
                <div class="color-picker-group">
                    <label class="toggle-label">Theme</label>
                    <div class="color-options">
                        <button class="color-btn" data-theme="default" title="Default"></button>
                        <button class="color-btn" data-theme="yellowgreen" title="Yellow Green"></button>
                        <button class="color-btn" data-theme="mediumspringgreen" title="Medium Spring Green"></button>
                        <button class="color-btn" data-theme="deepskyblue" title="Deep Sky Blue"></button>
                        
                    </div>
                </div>
            </div>
        </div>
        <div id="carContainer" class="car-container"></div>
    </div>
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Car World Book</p>
